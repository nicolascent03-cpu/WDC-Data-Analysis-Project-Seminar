<svg xmlns="http://www.w3.org/2000/svg" width="170" height="34" viewBox="0 0 170 34">
  <!-- The mark of the HTML version: "ADC" on the orange accent, then the full name on two lines. Streamlit shows a
       logo at most 32 px high and 220 px wide; two lines let the name use the whole height, so it reads larger. -->
  <rect x="0" y="1" width="48" height="32" rx="6" fill="#e48461"/>
  <text x="24" y="22.5" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="17" letter-spacing="0.6" fill="#1a1a19">ADC</text>
  <text x="57" y="14.5" textLength="110" lengthAdjust="spacingAndGlyphs"
        font-family="IBM Plex Sans Condensed, Arial Narrow, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="15" fill="#f0efec">Arms, Democracy</text>
  <text x="57" y="31" textLength="80" lengthAdjust="spacingAndGlyphs"
        font-family="IBM Plex Sans Condensed, Arial Narrow, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="15" fill="#f0efec">and Conflict</text>
</svg>
