<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arms-flow animation mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #111110; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #959086; --line: #2c2c2a;
  --land: #2a2a28; --accent: #e48461; --accent-soft: #3a241b;
  --f-sans: "IBM Plex Sans", system-ui, sans-serif; --f-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-sans); }
header { position: sticky; top: 0; z-index: 5; background: rgba(17,17,16,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0; }
h1 { font: 600 24px/1.2 var(--f-cond); margin: 0; }
h1 small { display: block; font: 400 13px var(--f-sans); color: var(--muted); margin-top: 2px; }
.ctrl { display: flex; align-items: center; gap: 12px; flex: 1 1 360px; justify-content: flex-end; }
.ctrl input { flex: 1; max-width: 420px; accent-color: var(--accent); }
.ctrl output { font: 500 22px var(--f-mono); min-width: 3em; }
button.play { min-height: 40px; padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent); color: #1a1a19; font: 600 15px var(--f-sans); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); padding-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
main { padding: 24px 0 64px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; position: relative; }
.card h2 { font: 600 19px/1.25 var(--f-cond); margin: 0; display: flex; align-items: center; gap: 10px; }
.card h2 b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 14px; flex: none; }
.card p { margin: 6px 0 12px; color: var(--ink2); font-size: 14px; }
.card .good { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.stage { position: relative; border-radius: 8px; overflow: hidden; background: #151514; }
.stage svg { display: block; width: 100%; height: auto; }
.land path { fill: var(--land); stroke: #151514; stroke-width: .5; }
.cap { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(17,17,16,.85); font-size: 14px; transition: opacity .5s; }
.cap b { color: var(--accent); font-family: var(--f-mono); margin-right: 8px; }
.ribbon { fill: none; stroke-linecap: round; transition: stroke-width .8s ease, opacity .8s ease, d .8s ease; }
.bloc path { transition: fill .7s ease; }
.node { transition: transform .8s ease; }
.node text { fill: var(--ink2); font: 11px var(--f-sans); }
.yearmark { font: 500 13px var(--f-mono); fill: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <h1>Arms-flow animations: 10 mockups<small>Real SIPRI deliveries (top 40 flows per year) on the site's map. One year control drives all panels except no. 10.</small></h1>
      <div class="ctrl">
        <button class="play" id="play" type="button">Play</button>
        <input id="year" type="range" min="1950" max="2025" value="1985" aria-label="Year">
        <output id="year-o">1985</output>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<script>

  function arcD(a, b, bend) {
    const [x1, y1] = a, [x2, y2] = b, dx = x2 - x1, dy = y2 - y1, k = bend == null ? .28 : bend;
    let cx = (x1 + x2) / 2 + dy * k, cy = (y1 + y2) / 2 - dx * k;

    return { d: "M" + x1 + "," + y1 + "Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + x2 + "," + y2, q: [x1, y1, cx, cy, x2, y2] };
  }
  function qpt(q, t) { const u = 1 - t; return [u * u * q[0] + 2 * u * t * q[2] + t * t * q[4], u * u * q[1] + 2 * u * t * q[3] + t * t * q[5]]; }

  const PANELS = [];

    frame(t) { for (const it of this.items) it.dots.forEach((c, i) => { const p = (t / it.dur + it.off + i / it.dots.length) % 1, [x, y] = qpt(it.q, p); c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("opacity", Math.min(1, Math.sin(p * Math.PI) * 1.6).toFixed(2)); }); } });

    year(y) { this.fx.innerHTML = ""; this.items = flows(y).map(([s, r, v, n]) => {

        const vis = p <= 1.05; it.head.setAttribute("opacity", vis && p <= 1 ? 1 : 0);
        const [hx, hy] = qpt(it.q, Math.min(p, 1)); it.head.setAttribute("cx", hx); it.head.setAttribute("cy", hy);
        for (const tl of it.tails) { if (!vis) { tl.e.setAttribute("points", ""); continue; } const a = Math.max(0, p - tl.len), b = Math.min(1, p), pts = [];
          for (let i = 0; i <= 10; i++) { const [x, y] = qpt(it.q, a + (b - a) * i / 10); pts.push(x.toFixed(1) + "," + y.toFixed(1)); } tl.e.setAttribute("points", pts.join(" ")); } } } });

  // 3 growing arcs + impact pulse
  PANELS.push({ t: "Growing arcs with impact pulse", d: "Arcs draw themselves from each supplier; when they land, the recipient sends out a ring sized by the amount delivered.", good: "Clear cause and effect · who received the most",
    year(y) { this.fx.innerHTML = ""; this.t0 = performance.now(); this.items = flows(y).map(([s, r, v, n], i) => {
        const a = arcD(P[s], P[r]);
        return { delay: i * 35, p: el("path", { d: a.d, fill: "none", stroke: col(n), "stroke-width": sw(v), "stroke-opacity": .75, pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1, "stroke-linecap": "round" }, this.fx),
          ring: el("circle", { cx: P[r][0], cy: P[r][1], r: 0, fill: "none", stroke: col(n), "stroke-width": 1.5 }, this.fx), R: 6 + 26 * Math.sqrt(v / DATA.vmax) };
      }); },
    frame(t) { const local = (t - this.t0) % 3600; for (const it of this.items) { const q = Math.max(0, Math.min(1, (local - it.delay) / 900)), e = 1 - Math.pow(1 - q, 3);
        it.p.setAttribute("stroke-dashoffset", (1 - e).toFixed(3)); const rt = local - it.delay - 900;
        if (rt > 0 && rt < 1100) { it.ring.setAttribute("r", (it.R * rt / 1100).toFixed(1)); it.ring.setAttribute("opacity", (1 - rt / 1100).toFixed(2)); } else it.ring.setAttribute("opacity", 0); } } });

  // 4 glowing heat network
  PANELS.push({ t: "Glowing heat network", d: "Thick blurred arcs blend into glowing corridors, so the busiest routes burn brightest. A thin core shimmers along each route.", good: "Cinematic · dark mode · presentations",
    init() { const defs = el("defs", {}, this.svg); defs.innerHTML = '<filter id="glow4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>'; this.stage.style.background = "#0b0b0a"; this.svg.querySelector(".land").style.opacity = .55; },
    year(y) { this.fx.innerHTML = ""; const glow = el("g", { filter: "url(#glow4)", style: "mix-blend-mode: screen" }, this.fx), core = el("g", { style: "mix-blend-mode: screen" }, this.fx); this.cores = [];
      for (const [s, r, v, n] of flows(y)) { const a = arcD(P[s], P[r]); el("path", { d: a.d, fill: "none", stroke: col(n), "stroke-width": sw(v) * 2.6, "stroke-opacity": .55 }, glow);
        this.cores.push(el("path", { d: a.d, fill: "none", stroke: "#fff", "stroke-opacity": .55, "stroke-width": Math.max(.6, sw(v) * .25), pathLength: 100, "stroke-dasharray": "14 6" }, core)); }
      this.glow = glow; },
    frame(t) { if (this.glow) this.glow.setAttribute("opacity", (.8 + .2 * Math.sin(t / 700)).toFixed(2)); this.cores.forEach((c) => c.setAttribute("stroke-dashoffset", (-(t / 60) % 100).toFixed(1))); } });

  // 5 morphing ribbons
  PANELS.push({ t: "Ribbons that morph between years", d: "Every supplier–recipient pair keeps its ribbon across years and smoothly thickens, thins, appears or dissolves as time moves.", good: "Trends · e.g. Soviet ribbons collapsing in 1991",
    init() { this.keys = new Map(); },
    year(y) { const now = new Set();
      for (const [s, r, v, n] of flows(y)) { const key = n + ">" + r; now.add(key); let p = this.keys.get(key);
        if (!p) { p = el("path", { class: "ribbon", d: arcD(P[s], P[r]).d, stroke: col(n), "stroke-opacity": .7 }, this.fx); p.style.strokeWidth = 0; this.keys.set(key, p); p.getBoundingClientRect(); }
        p.style.opacity = 1; p.style.strokeWidth = (sw(v) * 1.3).toFixed(1); }
      for (const [k, p] of this.keys) if (!now.has(k)) { p.style.strokeWidth = 0; p.style.opacity = 0; } } });

  // 6 chord ring
  PANELS.push({ t: "Chord ring around the map", d: "Suppliers (left) and recipients (right) sit on a ring; ribbons between them grow, shrink and slide as the ranking changes each year.", good: "Who arms whom · less geography",
    init() { this.svg.querySelector(".land").style.opacity = .22; this.nodes = new Map(); this.rib = new Map(); this.ribG = el("g", {}, this.fx); this.nodeG = el("g", {}, this.fx); },
    year(y) { const fl = flows(y).slice(0, 30), sup = {}, rec = {};
      for (const [s, r, v, n] of fl) { sup[n] = (sup[n] || 0) + v; rec[r] = (rec[r] || 0) + v; }
      const S = Object.entries(sup).sort((a, b) => b[1] - a[1]).slice(0, 7), R = Object.entries(rec).sort((a, b) => b[1] - a[1]).slice(0, 12);
      const cx = 480, cy = 235, rad = 200, pos = {}, seen = new Set(), maxv = Math.max(...S.map((x) => x[1]), ...R.map((x) => x[1]));
      const place = (list, a0, a1, kind) => list.forEach(([k, v], i) => { const ang = a0 + (a1 - a0) * (list.length === 1 ? .5 : i / (list.length - 1)), x = cx + rad * Math.cos(ang), yy = cy + rad * Math.sin(ang), id = kind + k; pos[id] = [x, yy]; seen.add(id);
        let g = this.nodes.get(id); if (!g) { g = el("g", { class: "node" }, this.nodeG); el("circle", { r: 4 }, g); el("text", { y: 4 }, g); this.nodes.set(id, g); }
        const c = g.firstChild, tx = g.lastChild, left = Math.cos(ang) < 0; g.style.transform = "translate(" + x.toFixed(1) + "px," + yy.toFixed(1) + "px)"; g.style.opacity = 1;
        c.setAttribute("r", (3 + 9 * Math.sqrt(v / maxv)).toFixed(1)); c.setAttribute("fill", kind === "s" ? col(k) : "#c3c2b7");
        tx.textContent = kind === "s" ? k : (DATA.names[k] || k); tx.setAttribute("x", left ? -16 : 16); tx.setAttribute("text-anchor", left ? "end" : "start"); });
      place(S, Math.PI * .62, Math.PI * 1.38, "s"); place(R, -Math.PI * .4, Math.PI * .4, "r");
      for (const [id, g] of this.nodes) if (!seen.has(id)) g.style.opacity = 0;
      const live = new Set();
      for (const [s, r, v, n] of fl) { const a = pos["s" + n], b = pos["r" + r]; if (!a || !b) continue; const key = n + ">" + r; live.add(key); let p = this.rib.get(key);
        const d = "M" + a[0].toFixed(1) + "," + a[1].toFixed(1) + " Q" + cx + "," + cy + " " + b[0].toFixed(1) + "," + b[1].toFixed(1);
        if (!p) { p = el("path", { class: "ribbon", stroke: col(n), "stroke-opacity": .55 }, this.ribG); p.style.d = 'path("' + d + '")'; p.style.strokeWidth = 0; this.rib.set(key, p); p.getBoundingClientRect(); }
        p.style.d = 'path("' + d + '")'; p.style.strokeWidth = (sw(v) * 1.6).toFixed(1); p.style.opacity = 1; }
      for (const [k, p] of this.rib) if (!live.has(k)) { p.style.strokeWidth = 0; p.style.opacity = 0; } } });

  // 7 supplier bloc colouring
  PANELS.push({ t: "Supplier bloc colouring", d: "Each country takes the colour of its main supplier (5-year window) and cross-fades as alliances shift; thin arcs show the year's biggest deals.", good: "Cold War blocs forming and dissolving",
    init() { this.svg.querySelector(".land").classList.add("bloc"); this.paths = [...this.svg.querySelectorAll(".land path")]; },
    year(y) { const m = DATA.main[y] || {};
      for (const p of this.paths) { const n = m[p.dataset.iso]; p.style.fill = n ? col(n) : ""; p.style.fillOpacity = n ? .72 : ""; }
      this.fx.innerHTML = ""; for (const [s, r, v] of flows(y).slice(0, 15)) el("path", { d: arcD(P[s], P[r]).d, fill: "none", stroke: "#fff", "stroke-opacity": .35, "stroke-width": .9 }, this.fx); } });

  // 8 pulse waves
  PANELS.push({ t: "Pulse waves from suppliers", d: "Each big supplier sends out ripples sized by its yearly exports, while its busiest routes flicker on and off.", good: "Shows how few suppliers dominate",
    year(y) { this.fx.innerHTML = ""; const ex = DATA.exp[y] || [], mx = Math.max(1, ...ex.map((e) => e[2]));
      this.arcs = flows(y).map(([s, r, v, n], i) => ({ i, e: el("path", { d: arcD(P[s], P[r]).d, fill: "none", stroke: col(n), "stroke-width": sw(v) * .8 }, this.fx) }));
      this.src = ex.filter((e) => P[e[1]]).map(([n, iso, v]) => { const R = 18 + 80 * Math.sqrt(v / mx), [x, yy] = P[iso];
        el("circle", { cx: x, cy: yy, r: 3 + 5 * Math.sqrt(v / mx), fill: col(n) }, this.fx);
        return { R, rings: [0, 1, 2].map(() => el("circle", { cx: x, cy: yy, fill: "none", stroke: col(n), "stroke-width": 1.6 }, this.fx)) }; }); },
    frame(t) { for (const s of this.src) s.rings.forEach((c, i) => { const ph = ((t / 2400) + i / 3) % 1; c.setAttribute("r", (s.R * ph).toFixed(1)); c.setAttribute("opacity", ((1 - ph) * .7).toFixed(2)); });
      for (const a of this.arcs) a.e.setAttribute("stroke-opacity", (.08 + .45 * Math.max(0, Math.sin(t / 450 + a.i * 1.7))).toFixed(2)); } });

  // 9 river of time
  PANELS.push({ h: 640, t: "Map plus river of time", d: "Below the map, a streamgraph shows each supplier's deliveries 1950–2025; a playhead sweeps along it in sync with the map arcs.", good: "Context for the whole period · one year in the map",
    init() { const keys = DATA.streamKeys, S = DATA.stream, n = S.length, x0 = 30, x1 = 930, top = 490, bot = 625, mid = (top + bot) / 2;
      const tot = S.map((r) => r.reduce((a, b) => a + b, 0)), mx = Math.max(...tot), sc = (bot - top) / mx, X = (i) => x0 + (x1 - x0) * i / (n - 1);
      const g = el("g", {}, this.svg); let base = S.map((r, i) => mid - tot[i] * sc / 2);
      keys.forEach((k, j) => { const upper = base.slice(), lower = base.map((b, i) => b + S[i][j] * sc);
        let d = "M" + upper.map((v, i) => X(i).toFixed(1) + "," + v.toFixed(1)).join("L") + "L" + lower.map((v, i) => [i, v]).reverse().map(([i, v]) => X(i).toFixed(1) + "," + v.toFixed(1)).join("L") + "Z";
        el("path", { d, fill: col(k), "fill-opacity": .85 }, g); base = lower; });
      for (const yy of [1950, 1970, 1991, 2010, 2025]) el("text", { x: X(yy - DATA.y0), y: 638, "text-anchor": "middle", class: "yearmark", style: "font-size:11px;fill:#959086" }, g).textContent = yy;
      this.ph = el("line", { y1: top - 8, y2: bot + 2, stroke: "#fff", "stroke-width": 1.5 }, g); this.phT = el("text", { y: top - 12, "text-anchor": "middle", class: "yearmark" }, g); this.X = X; },
    year(y) { const x = this.X(y - DATA.y0); this.ph.setAttribute("x1", x); this.ph.setAttribute("x2", x); this.phT.setAttribute("x", x); this.phT.textContent = y;
      this.fx.innerHTML = ""; this.arcs = flows(y).map(([s, r, v, n]) => el("path", { d: arcD(P[s], P[r]).d, fill: "none", stroke: col(n), "stroke-width": sw(v), "stroke-opacity": .7, pathLength: 100, "stroke-dasharray": "10 4" }, this.fx)); },
    frame(t) { (this.arcs || []).forEach((a) => a.setAttribute("stroke-dashoffset", (-(t / 50) % 100).toFixed(1))); } });

  // 10 spotlight story mode
  const STORY = [
    { y: 1973, isos: ["EGY", "ISR", "SYR", "JOR", "IRQ", "SAU"], cap: "Yom Kippur War" },
    { y: 1980, isos: ["IRN", "IRQ", "AFG", "PAK", "SAU", "SYR"], cap: "Iran–Iraq War begins; Soviet troops in Afghanistan" },
    { y: 1991, isos: null, cap: "Gulf War and the end of the Soviet Union" },
    { y: 2003, isos: ["IRQ", "SAU", "IRN", "TUR", "SYR", "KWT"], cap: "US-led invasion of Iraq" },
    { y: 2022, isos: ["UKR", "POL", "DEU", "ROU", "BLR", "LTU"], cap: "Russia's full-scale invasion of Ukraine" },
  ];
  PANELS.push({ own: true, t: "Spotlight story mode", d: "A guided tour: the map zooms to a region at key moments, dims everything else and shows a one-line caption. Runs on its own timeline.", good: "Presentations · the lecturer · first-time visitors",
    init() { this.cap = document.createElement("div"); this.cap.className = "cap"; this.stage.appendChild(this.cap); this.vb = [0, 0, W, H]; this.step = -1; this.next = 0; },
    show(i) { const s = STORY[i]; this.step = i; let box = [0, 0, W, H];
      if (s.isos) { const pts = s.isos.map((k) => P[k]).filter(Boolean), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        let x0 = Math.min(...xs) - 70, x1 = Math.max(...xs) + 70, y0 = Math.min(...ys) - 60, y1 = Math.max(...ys) + 60, w = x1 - x0, h = y1 - y0;
        if (w / h < W / H) { const nw = h * W / H; x0 -= (nw - w) / 2; w = nw; } else { const nh = w * H / W; y0 -= (nh - h) / 2; h = nh; } box = [x0, y0, w, h]; }
      this.from = this.vb.slice(); this.to = box; this.tz = performance.now();
      const on = s.isos ? new Set(s.isos) : null; this.fx.innerHTML = "";
      for (const [a, r, v, n] of flows(s.y)) { const hit = !on || on.has(r) || on.has(a); el("path", { d: arcD(P[a], P[r]).d, fill: "none", stroke: col(n), "stroke-width": sw(v), "stroke-opacity": hit ? .85 : .07, "stroke-linecap": "round" }, this.fx); }
      this.svg.querySelectorAll(".land path").forEach((p) => { p.style.opacity = !on || on.has(p.dataset.iso) ? 1 : .45; });
      this.cap.style.opacity = 0; setTimeout(() => { this.cap.innerHTML = "<b>" + s.y + "</b>" + s.cap; this.cap.style.opacity = 1; }, 450); },
    frame(t) { if (t > this.next) { this.show((this.step + 1) % STORY.length); this.next = t + 4800; }
      const q = Math.min(1, (t - this.tz) / 1300), e = q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
      this.vb = this.from.map((v, i) => v + (this.to[i] - v) * e); this.svg.setAttribute("viewBox", this.vb.map((v) => v.toFixed(1)).join(" ")); } });

  // ------------------------------------------------------------------ build cards
  const grid = document.getElementById("grid");
  PANELS.forEach((p, i) => {
    const card = document.createElement("section"); card.className = "card";
    card.innerHTML = "<h2><b>" + (i + 1) + "</b>" + p.t + "</h2><p>" + p.d + '</p><div class="stage">' + stageSvg(p.h) + '</div><p class="good">Good for: ' + p.good + "</p>";
    grid.appendChild(card); p.card = card; p.stage = card.querySelector(".stage"); p.svg = card.querySelector("svg"); p.fx = card.querySelector(".fx"); p.visible = true;
    if (p.init) p.init();
    if (p.year && !p.own) p.year(YEAR);
  });
  const io = new IntersectionObserver((es) => es.forEach((e) => { const p = PANELS.find((x) => x.card === e.target); if (p) p.visible = e.isIntersecting; }));
  PANELS.forEach((p) => io.observe(p.card));

  function setYear(y) { YEAR = y; document.getElementById("year").value = y; document.getElementById("year-o").textContent = y; PANELS.forEach((p) => { if (p.year && !p.own) p.year(y); }); }
  document.getElementById("year").addEventListener("input", (e) => setYear(+e.target.value));
  let timer = null; const btn = document.getElementById("play");
  btn.addEventListener("click", () => { if (timer) { clearInterval(timer); timer = null; btn.textContent = "Play"; return; }
    btn.textContent = "Pause"; if (YEAR >= DATA.y1) setYear(DATA.y0); timer = setInterval(() => { if (YEAR >= DATA.y1) { clearInterval(timer); timer = null; btn.textContent = "Play"; } else setYear(YEAR + 1); }, 1300); });
  function loop(t) { for (const p of PANELS) if (p.frame && p.visible) p.frame(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
