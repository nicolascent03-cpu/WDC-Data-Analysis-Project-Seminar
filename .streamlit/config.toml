[server]
# app/static/: the World map's fixed geometry, loaded once by the browser (see world_map.py)
enableStaticServing = true

[client]
# Hide Deploy / rerun / settings entries so the ADC site gets the whole window.
toolbarMode = "minimal"

[theme]
# Dark only, same look as the HTML prototype: IBM Plex fonts, warm dark greys, orange accent.
base = "dark"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans Condensed':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 11  # the whole app at about 67% of the browser default (16 px): text, spacing and padding scale with it
headingFontWeights = [600, 600, 600, 600, 500, 500]
# heading sizes of the HTML version (40, 26, 20, 16, 14, 13 px), scaled to 67% with the base font
headingFontSizes = ["27px", "18px", "14px", "11px", "10px", "9px"]
# key numbers: the HTML shows them in 22-24 px, not Streamlit's 36 px
metricValueFontSize = "18px"
metricValueFontWeight = 500
primaryColor = "#e48461"
backgroundColor = "#111110"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "7px"
buttonRadius = "6px"
linkUnderline = false
linkColor = "#e48461"
codeTextColor = "#f0efec"
codeBackgroundColor = "transparent"  # code spans are used for numbers in IBM Plex Mono, as the .num style of the HTML
dataframeHeaderBackgroundColor = "#1a1a19"
dataframeHeaderTextColor = "#959086"
# country colours of the HTML version (k0 ... k9)
chartCategoricalColors = ["#3987e5", "#e66767", "#199e70", "#c98500", "#9085e9", "#d95926", "#2bb5c0", "#e07ab0", "#a3b54a", "#b98a68"]
paddingTop = "0.5rem"
paddingBottom = "0.5rem"

[theme.sidebar]
backgroundColor = "#151514"
